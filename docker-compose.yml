version: '3.8'

services:
  driverguard:
    build: .
    container_name: driverguard-ai
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
